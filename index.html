<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookshelf – Absolute Y, Packed X</title>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    html, body {
      width: 100%;
      min-height: 100%;
      background-color: #2c1a12;
    }
    #app {
      display: flex;
      width: 100%;
      min-height: 100vh;
      align-items: stretch;
      justify-content: center;
      background-color: #2c1a12;
    }
    .scene {
      position: relative;
      width: 100vw;
      min-height: 100vh;
      height: auto;
      background-image: url('sbackground.jpg');
      background-size: cover;
      background-position: center bottom;
      background-repeat: no-repeat;
      background-color: #2c1a12;
      flex-shrink: 0;
    }
    .decor-container {
      display: none;
      flex: 1 1 0;
      overflow: hidden;
      background-color: #2c1a12;
      align-items: center;
      justify-content: center;
    }
    .decor-container img {
      height: 100%;
      width: auto;
      flex-shrink: 0;
    }

    /* ---------- BOOKS (absolute positioned) ---------- */
    .book-item {
      position: absolute;
      pointer-events: auto;
      cursor: grab;
      transform-origin: top left;
    }
    .book-item img {
      display: block;
      pointer-events: none;
    }
    .book-item.sortable-chosen {
      opacity: 0.7;
      outline: 2px solid #ffd700;
      z-index: 100;
    }
    .book-item.sortable-ghost {
      opacity: 0.3;
    }

    /* ---------- PC OVERRIDES ---------- */
    @media (min-width: 1024px) {
      html, body {
        overflow: hidden;
        height: 100%;
      }
      #app {
        min-height: 0;
        height: 100vh;
        flex-direction: row;
      }
      .scene {
        max-width: 1300px;
        height: 100vh;
        min-height: 0;
        background-size: contain;
        background-position: center;
        flex: 1 1 0;
        width: 100%;
      }
      .decor-container {
        display: flex;
        flex: 1 1 0;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="decor-left" class="decor-container"></div>
    <div class="scene" id="bookshelfContainer"></div>
    <div id="decor-right" class="decor-container"></div>
  </div>

  <script>
    // ================================================================

    // ================================================================
    const rawBooksMobile = [

      { src: "book8.png",  x: 123, y: 45,    scale: 0.22 },
      { src: "book9.png",  x: 133, y: 45,    scale: 0.22 },
      { src: "book10.png", x: 143, y: 35,    scale: 0.24 },
      { src: "book11.png", x: 158, y: 28,    scale: 0.25 },
      // Row 2
      { src: "book12.png", x: 14,  y: 219,   scale: 0.24 },

      { src: "book18.png", x: 103, y: 212,   scale: 0.25 },
      { src: "book19.png", x: 118, y: 223,   scale: 0.23 },
      { src: "book20.png", x: 128, y: 232,   scale: 0.22 },
      { src: "book21.png", x: 144, y: 200,   scale: 0.25 },
      { src: "book22.png", x: 158, y: 207,   scale: 0.24 },
      // Row 3
      { src: "book23.png", x: 14,  y: 370,   scale: 0.25 },
      { src: "book24.png", x: 26,  y: 370,   scale: 0.25 },
      { src: "book25.png", x: 40,  y: 370,   scale: 0.25 },

      { src: "book30.png", x: 115, y: 380,   scale: 0.25 },
      { src: "book31.png", x: 130, y: 372.5, scale: 0.25 },
      { src: "book32.png", x: 150, y: 400.5, scale: 0.20 },
      { src: "book33.png", x: 165, y: 395.5, scale: 0.25 },
      // Row 4
      { src: "book46.png", x: 14,  y: 550,   scale: 0.25 },
      { src: "book48.png", x: 26,  y: 550,   scale: 0.25 },
      { src: "book49.png", x: 40,  y: 550,   scale: 0.25 },
      { src: "book50.png", x: 55,  y: 551.5, scale: 0.25 },
      { src: "book51.png", x: 70,  y: 550,   scale: 0.25 },
      { src: "book52.png", x: 80,  y: 550,   scale: 0.25 },
      { src: "book53.png", x: 95,  y: 550,   scale: 0.25 },
      { src: "book55.png", x: 115, y: 550,   scale: 0.25 },
      { src: "book56.png", x: 130, y: 550,   scale: 0.25 },
      { src: "book57.png", x: 145, y: 550,   scale: 0.25 },
      { src: "book58.png", x: 155, y: 550,   scale: 0.25 },
    ];

    // PC version – same structure
    const rawBooksPC = [
      { src: "book1.png",  x: 84,  y: 29,   scale: 0.22 },
      { src: "book2.png",  x: 100, y: 28.5, scale: 0.22 },
      { src: "book3.png",  x: 113, y: 46,   scale: 0.19 },
      { src: "book4.png",  x: 193, y: 41.5, scale: 0.20 },
      { src: "book5.png",  x: 138, y: 58.8, scale: 0.17 },
      { src: "book6.png",  x: 153, y: 58,   scale: 0.17 },
      { src: "book7.png",  x: 168, y: 52,   scale: 0.18 },
      { src: "book8.png",  x: 183, y: 46.5, scale: 0.19 },
      { src: "book9.png",  x: 128, y: 47,   scale: 0.19 },
      { src: "book10.png", x: 213, y: 35,   scale: 0.21 },
      { src: "book11.png", x: 227.5, y: 28.5, scale: 0.22 },
      { src: "book12.png", x: 84,  y: 202,  scale: 0.21 },
      { src: "book13.png", x: 98,  y: 202,  scale: 0.21 },
      { src: "book14.png", x: 115, y: 197,  scale: 0.22 },
      { src: "book15.png", x: 128, y: 197,  scale: 0.22 },
      { src: "book16.png", x: 138, y: 197,  scale: 0.22 },
      { src: "book17.png", x: 153, y: 197,  scale: 0.22 },
      { src: "book18.png", x: 168, y: 197,  scale: 0.22 },
      { src: "book19.png", x: 183, y: 208,  scale: 0.20 },
      { src: "book20.png", x: 193, y: 211,  scale: 0.20 },
      { src: "book21.png", x: 213, y: 187,  scale: 0.22 },
      { src: "book22.png", x: 227, y: 193,  scale: 0.21 },
      { src: "book23.png", x: 84,  y: 325,  scale: 0.25 },
      { src: "book24.png", x: 98,  y: 325,  scale: 0.25 },
      { src: "book25.png", x: 115, y: 325,  scale: 0.25 },
      { src: "book26.png", x: 128, y: 325,  scale: 0.25 },
      { src: "book27.png", x: 138, y: 355,  scale: 0.20 },
      { src: "book28.png", x: 153, y: 325,  scale: 0.25 },
      { src: "book29.png", x: 168, y: 355,  scale: 0.20 },
      { src: "book30.png", x: 183, y: 338,  scale: 0.25 },
      { src: "book31.png", x: 193, y: 325,  scale: 0.25 },
      { src: "book32.png", x: 213, y: 355,  scale: 0.20 },
      { src: "book33.png", x: 227, y: 350,  scale: 0.25 },
      { src: "book46.png", x: 84,  y: 500,  scale: 0.25 },
      { src: "book48.png", x: 98,  y: 500,  scale: 0.25 },
      { src: "book49.png", x: 115, y: 500,  scale: 0.25 },
      { src: "book50.png", x: 128, y: 500,  scale: 0.25 },
      { src: "book51.png", x: 138, y: 500,  scale: 0.25 },
      { src: "book52.png", x: 153, y: 500,  scale: 0.25 },
      { src: "book53.png", x: 168, y: 500,  scale: 0.25 },
      { src: "book55.png", x: 183, y: 500,  scale: 0.25 },
      { src: "book56.png", x: 193, y: 500,  scale: 0.25 },
      { src: "book57.png", x: 213, y: 500,  scale: 0.25 },
      { src: "book58.png", x: 227, y: 500,  scale: 0.25 },
    ];

    // ================================================================
    //  🖼️  PC SIDE DECORATIONS
    // ================================================================
    const DECOR_PC = {
      leftImage: "decor-left.png",
      rightImage: "decor-right.png",
      scale: 1.0,
      leftOffsetX: 0,
      leftOffsetY: 0,
      rightOffsetX: 0,
      rightOffsetY: 0,
    };

    // ================================================================
    //  🚀  BUILD
    // ================================================================
    const PC_BREAKPOINT = 1024;
    const isPC = window.innerWidth > PC_BREAKPOINT;
    const rawData = isPC ? rawBooksPC : rawBooksMobile;

    // Assign shelf index based on Y proximity
    const SHELF_Y_MAP = [28, 212, 370, 550];
    function getShelfIndex(y) {
      let minDist = Infinity, idx = 0;
      SHELF_Y_MAP.forEach((sy, i) => {
        const d = Math.abs(y - sy);
        if (d < minDist) { minDist = d; idx = i; }
      });
      return idx;
    }

    // Build data array with shelf and order
    const booksData = rawData.map((book, index) => {
      const shelf = getShelfIndex(book.y);
      return { ...book, shelf, order: index };
    });
    booksData.sort((a, b) => a.shelf - b.shelf || a.order - b.order);

    const container = document.getElementById('bookshelfContainer');
    const imageSizes = {};

    function renderShelves() {
      // Remove old elements
      container.querySelectorAll('.book-item').forEach(el => el.remove());

      // Group by shelf
      const groups = {};
      booksData.forEach(book => {
        if (!groups[book.shelf]) groups[book.shelf] = [];
        groups[book.shelf].push(book);
      });

      const shelfKeys = Object.keys(groups).sort((a,b) => a-b);
      shelfKeys.forEach(shelfIdx => {
        const books = groups[shelfIdx];
        books.sort((a,b) => a.order - b.order);

        // Compute packed X positions (left to right, no gaps)
        let currentX = 10; // left padding
        books.forEach(book => {
          const size = imageSizes[book.src] || { width: 50, height: 50 };
          const scaledWidth = size.width * book.scale;
          const scaledHeight = size.height * book.scale;

          // Create book element
          const item = document.createElement('div');
          item.className = 'book-item';
          item.dataset.src = book.src;
          // Use the book's original Y (not relative to shelf)
          item.style.left = currentX + 'px';
          item.style.top = book.y + 'px';  // ← KEEP ORIGINAL Y

          const img = document.createElement('img');
          img.src = book.src;
          img.alt = book.src;
          img.style.width = scaledWidth + 'px';
          img.style.height = scaledHeight + 'px';

          item.appendChild(img);
          container.appendChild(item);

          currentX += scaledWidth;
        });
      });

      // Apply Sortable to the container (all books are direct children)
      new Sortable(container, {
        group: 'books',
        animation: 150,
        ghostClass: 'sortable-ghost',
        chosenClass: 'sortable-chosen',
        dragClass: 'sortable-drag',
        // We need to handle drag between shelves manually
        // We'll use the onEnd to update shelf based on Y position
        onEnd: function(evt) {
          const movedSrc = evt.item.dataset.src;
          const book = booksData.find(b => b.src === movedSrc);
          if (!book) return;

          // Determine new shelf based on the drop position's Y
          const dropY = evt.item.style.top; // we get the Y from the element
          // But we need the Y of the drop point – we can get the mouse Y
          // Instead, we'll use the final position of the dragged item
          const rect = evt.item.getBoundingClientRect();
          const containerRect = container.getBoundingClientRect();
          const relativeY = rect.top - containerRect.top + window.scrollY;
          // Map to shelf
          const newShelf = getShelfIndex(relativeY);
          book.shelf = newShelf;

          // Reassign orders based on DOM order
          const items = container.querySelectorAll('.book-item');
          items.forEach((item, idx) => {
            const src = item.dataset.src;
            const b = booksData.find(b => b.src === src);
            if (b) b.order = idx;
          });

          // Re-render
          renderShelves();
        }
      });
    }

    // Load images to get natural dimensions
    function loadImages(callback) {
      const promises = booksData.map(book => {
        return new Promise((resolve) => {
          const img = new Image();
          img.onload = function() {
            imageSizes[book.src] = { width: this.naturalWidth, height: this.naturalHeight };
            resolve();
          };
          img.onerror = function() {
            imageSizes[book.src] = { width: 100, height: 150 };
            resolve();
          };
          img.src = book.src;
        });
      });
      Promise.all(promises).then(callback);
    }

    // ---- Inject side decorations (PC only) ----
    if (isPC) {
      const leftContainer = document.getElementById('decor-left');
      const rightContainer = document.getElementById('decor-right');
      if (DECOR_PC.leftImage) {
        const leftImg = document.createElement('img');
        leftImg.src = DECOR_PC.leftImage;
        leftImg.alt = 'Left decor';
        leftImg.style.transform = `scale(${DECOR_PC.scale})`;
        leftImg.style.marginLeft = DECOR_PC.leftOffsetX + 'px';
        leftImg.style.marginTop = DECOR_PC.leftOffsetY + 'px';
        leftContainer.appendChild(leftImg);
      }
      if (DECOR_PC.rightImage) {
        const rightImg = document.createElement('img');
        rightImg.src = DECOR_PC.rightImage;
        rightImg.alt = 'Right decor';
        rightImg.style.transform = `scale(${DECOR_PC.scale})`;
        rightImg.style.marginRight = DECOR_PC.rightOffsetX + 'px';
        rightImg.style.marginTop = DECOR_PC.rightOffsetY + 'px';
        rightContainer.appendChild(rightImg);
      }
    }

    // Start
    loadImages(() => {
      renderShelves();
      console.log(isPC ? '🖥️ PC – Y positions preserved' : '📱 – Y positions preserved');
    });
  </script>
</body>
</html>
